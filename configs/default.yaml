project:
  name: ecg_disease_classification
  output_root: runs
  seed: 42

run:
  mode: train_eval
  run_name: mobilenet_v2_default

data:
  data_dir: data
  auto_split_if_missing: true
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  stratified_split: true
  max_samples: null
  num_classes: 4
  class_names:
    - Normal
    - Abnormal
    - HistoryMI
    - MI
  label_mapping:
    ECG_Normal: Normal
    ECG_Abnormal: Abnormal
    ECG_HistoryMI: HistoryMI
    ECG_MI: MI
  image_size: 224
  input_scheme: single_clean_image

model:
  model_name: mobilenet_v2
  pretrained: true
  freeze_backbone: false
  dropout: 0.3

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  min_learning_rate: 0.000001
  weight_decay: 0.00001
  optimizer: adamw
  scheduler: cosine
  early_stopping: false
  patience: 10
  monitor_metric: val_macro_f1

runtime:
  device: auto
  num_workers: 2
  mixed_precision: true

outputs:
  save_plots: true
  save_predictions: true
  save_checkpoints: true
